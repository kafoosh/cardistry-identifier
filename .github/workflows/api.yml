name: Deploy API to Cloudflare

on:
  push:
    branches: [main]
    paths: ['api/**', 'src/shared/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set yet; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npx tsc
      - name: Find or create the D1 database
        if: steps.check.outputs.ready == 'true'
        run: node scripts/ensure-d1.mjs
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy | tee deploy.log
      - name: Set Turnstile secret
        if: steps.check.outputs.ready == 'true' && env.TURNSTILE_SECRET != ''
        run: printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET
      - name: Report URL
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "API deployed at $url" >> "$GITHUB_STEP_SUMMARY"
          # A brand-new workers.dev subdomain can take a few minutes to get its certificate.
          for i in $(seq 1 12); do
            if curl -sf "$url/api/health"; then exit 0; fi
            sleep 15
          done
          echo "::warning::Deployed, but $url did not answer yet (new subdomains can take a few minutes)."

