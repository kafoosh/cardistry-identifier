name: Seed library

# Manual only. Adds the takes in seed/<batch>/ to the shared library through
# the database, with the same checks as an upload. Run it with dry_run first:
# that only lists what would be added.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Folder under seed/ holding the takes (one JSON per take)
        required: true
      dry_run:
        description: Only list what would be added
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Build the seeding script
        run: npx esbuild scripts/seed.ts --bundle --platform=node --format=esm --outfile=seed.mjs --log-level=error
      - name: Check the takes
        run: node seed.mjs --dir "../seed/${{ inputs.batch }}" --out seed.sql | tee -a "$GITHUB_STEP_SUMMARY"
      - run: node scripts/ensure-d1.mjs
      - name: Count before
        run: npx wrangler d1 execute DB --remote --command "SELECT COUNT(*) AS recordings FROM recordings" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Insert
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 execute DB --remote --file seed.sql
      - name: Count after
        if: ${{ !inputs.dry_run }}
        run: npx wrangler d1 execute DB --remote --command "SELECT COUNT(*) AS recordings FROM recordings" | tee -a "$GITHUB_STEP_SUMMARY"
