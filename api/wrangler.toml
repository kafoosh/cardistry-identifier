name = "cardistry-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the API (CORS). Comma-separated origins.
ALLOWED_ORIGINS = "https://kafoosh.github.io,http://localhost:5173,http://localhost:4173"
# Max shared recordings per device and per IP per day.
DAILY_UPLOAD_LIMIT = "40"
# TURNSTILE_SECRET is a secret: `wrangler secret put TURNSTILE_SECRET`.
# When it's unset (local dev), Turnstile checks are skipped.

[[d1_databases]]
binding = "DB"
database_name = "cardistry"
# Filled in by the deploy workflow (scripts/ensure-d1.mjs); for local dev any value works.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
